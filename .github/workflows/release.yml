name: Release

# Publie une release GitHub (DMG + artefacts d'auto-update) à chaque tag "vX.Y.Z".
# Pré-requis (une seule fois) : ajouter dans Settings → Secrets and variables → Actions :
#   - TAURI_SIGNING_PRIVATE_KEY          = contenu de src-tauri/pierscrm-updater.key
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD = (vide, mais crée quand même le secret)
#   - APPLE_CERTIFICATE          = base64 de ~/.pierscrm-signing/pierscrm-signing.p12
#   - APPLE_CERTIFICATE_PASSWORD = contenu de ~/.pierscrm-signing/p12.pass
#
# Publier une version :
#   1) bump "version" dans src-tauri/tauri.conf.json (ET package.json)
#   2) git tag v0.2.0 && git push origin v0.2.0
# → le workflow build, signe, crée la release et attache latest.json.
#   Les apps installées se mettent à jour toutes seules.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust (both macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Caches are scoped per ref: a tag run can only restore what the default
      # branch saved, never another tag's cache (every release used to log
      # "No cache found" and rebuild all crates twice). warm-cache.yml fills the
      # cache from main under this same shared key; tag runs only read it.
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: macos-universal-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Code signing with the self-signed "PiersCRM Self-Signed" certificate
      # (public part in src-tauri/signing/, key + password in the
      # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD secrets). Every version
      # carries the same signature, so the macOS keychain keeps its "Always
      # allow" from one update to the next instead of asking again. macOS only
      # signs with a certificate it trusts: the runner trusts this one for code
      # signing (passwordless sudo on GitHub's macOS runners).
      - name: Trust the signing certificate
        run: sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain src-tauri/signing/pierscrm-selfsigned.pem

      # Tauri's own import (APPLE_CERTIFICATE) only resolves Apple-issued
      # identity names ("Developer ID Application: ..."), so the certificate
      # goes into a build keychain here and tauri.conf.json signs with its
      # SHA-1 (codesign accepts a hash as identity).
      - name: Import the signing identity
        env:
          P12_B64: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          security find-identity -v -p codesigning "$KC"

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PiersCRM ${{ github.ref_name }}"
          releaseBody: "Mise à jour automatique : l'app se met à jour seule au démarrage."
          releaseDraft: false
          prerelease: false
          # Build universel : un seul DMG pour Mac Intel ET Apple Silicon.
          args: --target universal-apple-darwin
