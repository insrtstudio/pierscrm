[package]
name = "pierscrm"
version = "0.1.0"
description = "PiersCRM — desktop booking & artist management"
authors = ["Insrt.Studio"]
edition = "2021"

[lib]
name = "pierscrm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# Native macOS notification when the daily residency report is ready.
tauri-plugin-notification = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "rustls-tls",
    "hostname",
    "pool",
] }
calamine = "0.26"
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
reqwest = { version = "0.13", features = ["json", "blocking"] }
tokio = { version = "1", features = ["time"] }
regex = "1"
# Secrets (SMTP password, API keys) live in the macOS Keychain, not in SQLite.
keyring = { version = "3", features = ["apple-native"] }
# Reply detection (read-only IMAP scan of the sender's inbox).
imap = "2.4"
native-tls = "0.2"

[profile.release]
# NOT "abort": a panic in a background harvest/enrich worker must never take the
# whole app down. With unwind, a panicked task aborts alone and the app survives.
#
# CI time vs size: `lto = true` + `codegen-units = 1` compiled the app crate and
# ran a single-threaded whole-program link, ~4 min per arch out of a 15 min
# universal build. Thin LTO with parallel codegen keeps most of the cross-crate
# inlining/dead-code removal and uses all runner cores; the binary is a few
# percent larger (an app this size moves by a couple of MB at most, the
# dependencies dominate) and runtime is unchanged for an I/O-bound app.
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
